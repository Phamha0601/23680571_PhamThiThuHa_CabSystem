openapi: 3.0.0

info:
  title: Fare Calculation
  description: |
    API for calculating the fare that the customer
    has to pay based on trip information.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

paths:

  /fares:
    post:
      summary: Calculate trip fare
      operationId: calculateFare
      tags:
        - Fare Calculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FareCalculationRequest'
      responses:
        '200':
          description: Trip fare calculated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
        '400':
          description: Invalid trip information
        '404':
          description: Trip not found
        '500':
          description: Internal server error

  /fares/{tripId}:
    get:
      summary: Get trip fare
      operationId: getTripFare
      tags:
        - Fare Calculation
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Trip fare information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'
        '404':
          description: Fare not found
        '500':
          description: Internal server error

components:

  schemas:

    FareCalculationRequest:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
        distance:
          type: number
          format: double
          description: Trip distance
        vehicleType:
          type: string
          enum:
            - car
            - motorcycle
      required:
        - tripId
        - distance
        - vehicleType

    Fare:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
        distance:
          type: number
          format: double
        vehicleType:
          type: string
          enum:
            - car
            - motorcycle
        amount:
          type: number
          format: double
          description: Total fare amount
        currency:
          type: string
          example: VND
