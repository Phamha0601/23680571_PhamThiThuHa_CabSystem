openapi: 3.0.0

info:
  title: Payment Management API
  description: |
    API for processing trip payments using cash
    or electronic payment methods.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

paths:

  /payments:
    post:
      summary: Create a payment
      operationId: createPayment
      tags:
        - Payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid payment information
        '404':
          description: Trip not found
        '500':
          description: Internal server error

  /payments/{paymentId}:
    get:
      summary: Get payment information
      operationId: getPayment
      tags:
        - Payments
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Payment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found
        '500':
          description: Internal server error

components:

  schemas:

    PaymentRequest:
      type: object
      properties:
        tripId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        paymentMethod:
          type: string
          enum:
            - cash
            - electronic
      required:
        - tripId
        - amount
        - paymentMethod

    Payment:
      type: object
      properties:
        paymentId:
          type: integer
          format: int64
        tripId:
          type: integer
          format: int64
        amount:
          type: number
          format: double
        paymentMethod:
          type: string
          enum:
            - cash
            - electronic
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
        paymentTime:
          type: string
          format: date-time

