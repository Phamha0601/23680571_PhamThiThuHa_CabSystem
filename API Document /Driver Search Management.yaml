openapi: 3.0.0

info:
  title: Driver Search Management
  description: |
    API for finding and prioritizing suitable drivers
    based on their availability and location.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

paths:

  /driver-search:
    post:
      summary: Find suitable drivers
      operationId: findSuitableDrivers
      tags:
        - Driver Search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverSearchRequest'
      responses:
        '200':
          description: Suitable drivers found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
        '400':
          description: Invalid search information
        '404':
          description: No suitable driver found
        '500':
          description: Internal server error

  /driver-search/{bookingId}:
    get:
      summary: Get driver search result
      operationId: getDriverSearchResult
      tags:
        - Driver Search
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Driver search result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverSearchResult'
        '404':
          description: No suitable driver found
        '500':
          description: Internal server error

components:

  schemas:

    DriverSearchRequest:
      type: object
      properties:
        bookingId:
          type: integer
          format: int64
        customerLocation:
          type: string
          description: Customer location
      required:
        - bookingId
        - customerLocation

    Driver:
      type: object
      properties:
        driverId:
          type: integer
          format: int64
        name:
          type: string
        location:
          type: string
        status:
          type: string
          enum:
            - available
            - busy
            - offline
        distance:
          type: number
          format: double
        rating:
          type: number
          format: double

    DriverSearchResult:
      type: object
      properties:
        bookingId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - searching
            - driver_found
            - no_driver
