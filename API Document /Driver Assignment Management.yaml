openapi: 3.0.0

info:
  title: Driver Assignment Management
  description: |
    API for assigning drivers to bookings,
    sending trip requests to drivers,
    and finding another driver when a request is rejected.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

paths:

  /driver-assignments:
    post:
      summary: Assign a driver to a booking
      operationId: assignDriver
      tags:
        - Driver Assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverAssignmentRequest'
      responses:
        '200':
          description: Driver assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAssignment'
        '400':
          description: Invalid assignment information
        '404':
          description: No suitable driver found
        '500':
          description: Internal server error

  /driver-assignments/{assignmentId}:
    get:
      summary: Get driver assignment information
      operationId: getDriverAssignment
      tags:
        - Driver Assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Driver assignment information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverAssignment'
        '404':
          description: Assignment not found
        '500':
          description: Internal server error

components:

  schemas:

    DriverAssignmentRequest:
      type: object
      properties:
        bookingId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
      required:
        - bookingId
        - driverId

    DriverAssignment:
      type: object
      properties:
        assignmentId:
          type: integer
          format: int64
        bookingId:
          type: integer
          format: int64
        driverId:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
            - reassigned

