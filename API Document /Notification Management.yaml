openapi: 3.0.0

info:
  title: Notification Management API
  description: |
    API for sending notifications about bookings,
    drivers, trips, and payments.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

paths:

  /notifications:
    post:
      summary: Send a notification
      operationId: sendNotification
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '200':
          description: Notification sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: Invalid notification information
        '404':
          description: Recipient not found
        '500':
          description: Internal server error

  /notifications/{notificationId}:
    get:
      summary: Get notification information
      operationId: getNotification
      tags:
        - Notifications
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Notification information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          description: Notification not found
        '500':
          description: Internal server error

components:

  schemas:

    NotificationRequest:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - booking
            - driver
            - trip
            - payment
        message:
          type: string
      required:
        - userId
        - type
        - message

    Notification:
      type: object
      properties:
        notificationId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - booking
            - driver
            - trip
            - payment
        message:
          type: string
        status:
          type: string
          enum:
            - unread
            - read
        createdAt:
          type: string
          format: date-time

